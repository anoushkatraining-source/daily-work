<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="todo-container">
        <h2>Todo List</h2>
        <div class="todo-input-wrapper">
            <input type="text" id="todo-input" onkeyup="validate()" placeholder="Enter a new task">
            <!-- <input type="text" onkeyup="validate" id="todo-input" placeholder="Enter task"> -->
            <input type="time" id="todo-time">
        </div>
        <div class="urgent-wrapper">
            <!-- <label>
                <input type="radio" name="urgency" value="urgent" id="urgent" /> Urgent
            </label>
            <label>
                <input type="radio" name="urgency" value="not-urgent" id="not-urgent" checked /> Not Urgent
            </label> -->
            <form>
                <label for="priority">Task Urgency:</label>
                <select name="urgency" id="severity">
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </form>
        </div>
        <button onclick="addTodo()">Add Todo</button>
        <button onclick="sortByName()">Sort</button>
        <div class="error" id="error">Name is mandatory</div>
        <ul id="todo-list"></ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
